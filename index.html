<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>💌 Walentynka</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* ===== KOPERTA ===== */
.envelope {
    width: 240px;
    height: 160px;
    background: #fff;
    position: relative;
    cursor: pointer;
    border-radius: 6px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    animation: slideIn 1.2s ease forwards;
}

@keyframes slideIn {
    from { transform: translateY(300px) scale(0.8); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
}

.flap {
    position: absolute;
    inset: 0;
    background: #f06292;
    clip-path: polygon(0 0, 100% 0, 50% 50%);
    transform-origin: top;
    transition: transform 0.9s cubic-bezier(.4,0,.2,1);
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.tap {
    position: absolute;
    bottom: -40px;
    width: 100%;
    text-align: center;
    color: white;
}

/* ===== KARTKA ===== */
.card {
    position: absolute;
    width: 320px;
    background: white;
    border-radius: 18px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    transform: translateY(200px) scale(0.8);
    opacity: 0;
    transition: all 1s cubic-bezier(.4,0,.2,1);
}

.card.show {
    transform: translateY(0) scale(1);
    opacity: 1;
}

.fade {
    animation: fadeIn 1.2s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.buttons {
    margin-top: 20px;
    display: flex;
    justify-content: space-around;
}

button {
    padding: 10px 22px;
    border-radius: 20px;
    border: none;
    font-size: 16px;
    cursor: pointer;
}

#yes {
    background: #e91e63;
    color: white;
}

#no {
    background: #ccc;
    position: relative;
}

/* ===== GALERIA ===== */
.gallery {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: 0;
    transition: opacity 1.2s ease;
}

.gallery.show {
    z-index: 1;
    opacity: 1;
}

.slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: slideShow 18s infinite;
}

.slide:nth-child(1) { background-image: url("images/zdjecie1.jpg"); }
.slide:nth-child(2) { background-image: url("images/zdjecie2.jpg"); animation-delay: 6s; }
.slide:nth-child(3) { background-image: url("images/zdjecie3.jpg"); animation-delay: 12s; }

@keyframes slideShow {
    10% { opacity: 1; }
    40% { opacity: 1; transform: scale(1.05); }
    60% { opacity: 0; }
}

/* ===== SERCA ===== */
.heart {
    position: fixed;
    bottom: -20px;
    animation: floatUp 6s linear infinite;
    cursor: pointer;
}

@keyframes floatUp {
    to { transform: translateY(-120vh); opacity: 0; }
}

/* ===== KONFETTI ===== */
.confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 14px;
    animation: fall 4s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="tap">👆 Kliknij</div>
</div>

<div class="card" id="card">
    <h1 class="fade">💖 Zostaniesz moją walentynką? 💖</h1>
    <div class="buttons fade">
        <button id="yes">TAK 💕</button>
        <button id="no">NIE 😥 </button>
    </div>
    <p id="counter" class="fade"></p>
</div>

<div class="gallery" id="gallery">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
</div>

<script>
const envelope = document.getElementById("envelope");
const card = document.getElementById("card");
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const gallery = document.getElementById("gallery");

/* OTWIERANIE KOPERTY */
envelope.addEventListener("click", () => {
    envelope.classList.add("open");
    setTimeout(() => {
        envelope.style.display = "none";
        card.classList.add("show");
    }, 700);
});

/* UCIEKAJĄCE NIE */
function moveNo() {
    noBtn.style.transform =
        `translate(${Math.random()*200-100}px, ${Math.random()*200-100}px)`;
}
noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", moveNo);

/* TAK */
yesBtn.addEventListener("click", () => {
    card.innerHTML = `
        <h1 class="fade">💘 YEEEEEEEEEEAA! Kocham Cię 💘</h1>
        <p class="fade">— jakup<3 </p>
    `;
    gallery.classList.add("show");
    startHearts();
    startConfetti();

    setTimeout(() => {
        card.innerHTML = `
            <h1 class="fade">🌹 Randka? 🌹</h1>
            <p class="fade">14 lutego, godz. 18:00</p>
            <p class="fade">📍 Japan Sun Sushi 🍣</p>
            <p class="fade">— jakup :p </p>
        `;
    }, 2500);
});

/* SERCA + WIADOMOŚĆ */
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random()*20+14)+"px";
        heart.onclick = () =>
            alert("Kocham cie najmocniej na całym świecie!!!!!!!!! 😋😘 ");
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),6000);
    }, 400);
}

/* KONFETTI */
function startConfetti() {
    for(let i=0;i<120;i++){
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random()*100+"vw";
        c.style.background =
            `hsl(${Math.random()*360},100%,70%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }
}

/* LICZNIK */
const startDate = new Date("2025-02-02");
setInterval(() => {
    const days = Math.floor((new Date()-startDate)/(1000*60*60*24));
    document.getElementById("counter").innerText =
        `Jesteśmy razem już ${days} dni.`;
},1000);
</script>

</body>
</html>
