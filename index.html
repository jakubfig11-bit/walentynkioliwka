<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>💌 Walentynka</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #ff9a9e, transparent 40%),
        radial-gradient(circle at 80% 30%, #fad0c4, transparent 45%),
        radial-gradient(circle at 50% 80%, #fbc2eb, transparent 50%),
        linear-gradient(135deg, #ff758c, #ff7eb3);
    background-size: 200% 200%;
    animation: bgMove 18s ease-in-out infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* subtle glow */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    backdrop-filter: blur(8px);
    pointer-events: none;
}

/* ===== KOPERTA ===== */
.envelope {
    width: 240px;
    height: 160px;
    background: rgba(255,255,255,0.95);
    position: relative;
    cursor: pointer;
    border-radius: 12px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        0 0 30px rgba(255,255,255,0.4);
    animation: envelopeFloat 2.8s ease-in-out infinite,
               slideIn 1.4s ease forwards;
}

@keyframes slideIn {
    from { transform: translateY(300px) scale(0.85); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
}

@keyframes envelopeFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.flap {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ff5f9e, #ff8fb1);
    clip-path: polygon(0 0, 100% 0, 50% 55%);
    transform-origin: top;
    transition: transform 1s cubic-bezier(.22,1,.36,1);
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.tap {
    position: absolute;
    bottom: -44px;
    width: 100%;
    text-align: center;
    color: white;
    opacity: .9;
    animation: tapPulse 1.6s ease-in-out infinite;
}

@keyframes tapPulse {
    0%,100% { opacity: .6; }
    50% { opacity: 1; }
}

/* ===== KARTKA ===== */
.card {
    position: absolute;
    width: 330px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border-radius: 22px;
    padding: 26px;
    text-align: center;
    box-shadow:
        0 30px 80px rgba(0,0,0,0.4),
        inset 0 0 20px rgba(255,255,255,0.6);
    transform: translateY(220px) scale(0.85);
    opacity: 0;
    transition: all 1.2s cubic-bezier(.22,1,.36,1);
}

.card.show {
    transform: translateY(0) scale(1);
    opacity: 1;
}

.fade {
    animation: fadeInUp 1.3s ease forwards;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}

.buttons {
    margin-top: 22px;
    display: flex;
    justify-content: space-around;
}

button {
    padding: 11px 24px;
    border-radius: 22px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

#yes {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: white;
}

#no {
    background: #ddd;
    position: relative;
}

/* ===== GALERIA ===== */
.gallery {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: 0;
    transition: opacity 1.4s ease;
}

.gallery.show {
    z-index: 1;
    opacity: 1;
}

.slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: slideShow 18s infinite;
}

.slide:nth-child(1) { background-image: url("images/zdjecie1.jpg"); }
.slide:nth-child(2) { background-image: url("images/zdjecie2.jpg"); animation-delay: 6s; }
.slide:nth-child(3) { background-image: url("images/zdjecie3.jpg"); animation-delay: 12s; }

@keyframes slideShow {
    10% { opacity: 1; transform: scale(1); }
    40% { opacity: 1; transform: scale(1.08); }
    60% { opacity: 0; }
}

/* ===== SERCA ===== */
.heart {
    position: fixed;
    bottom: -20px;
    animation: floatUp 6.5s linear forwards;
    cursor: pointer;
    filter: drop-shadow(0 0 6px rgba(255,0,80,.6));
}

@keyframes floatUp {
    to { transform: translateY(-130vh) scale(1.1); opacity: 0; }
}

/* ===== KONFETTI ===== */
.confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 14px;
    animation: fall 4.5s linear forwards;
}

@keyframes fall {
    to { transform: translateY(120vh) rotate(540deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="tap">👆 Kliknij</div>
</div>

<div class="card" id="card">
    <h1 class="fade">Zostaniesz moją walentynką? 💖</h1>
    <div class="buttons fade">
        <button id="yes">TAK 💕</button>
        <button id="no">NIE 😥 </button>
    </div>
    <p id="counter" class="fade"></p>
</div>

<div class="gallery" id="gallery">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
</div>

<script>
const envelope = document.getElementById("envelope");
const card = document.getElementById("card");
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const gallery = document.getElementById("gallery");

/* OTWIERANIE KOPERTY */
envelope.addEventListener("click", () => {
    envelope.classList.add("open");
    setTimeout(() => {
        envelope.style.display = "none";
        card.classList.add("show");
    }, 750);
});

/* UCIEKAJĄCE NIE */
function moveNo() {
    noBtn.style.transform =
        `translate(${Math.random()*200-100}px, ${Math.random()*200-100}px)`;
}
noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", moveNo);

/* TAK */
yesBtn.addEventListener("click", () => {
    card.innerHTML = `
        <h1 class="fade">💘 YEEEEEEEEEEAA! Kocham Cię 💘</h1>
        <p class="fade">— jakup<3 </p>
    `;
    gallery.classList.add("show");
    startHearts();
    startConfetti();

    setTimeout(() => {
        card.innerHTML = `
            <h1 class="fade">🌹 Randka? 🌹</h1>
            <p class="fade">14 lutego, godz. 18:00</p>
            <p class="fade">📍 Japan Sun Sushi 🍣</p>
            <p class="fade">— jakup :p </p>
        `;
    }, 2500);
});

/* SERCA + WIADOMOŚĆ */
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random()*20+14)+"px";
        heart.onclick = () =>
            alert("Kocham cie najmocniej na całym świecie!!!!!!!!! 😋😘 ");
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),6500);
    }, 420);
}

/* KONFETTI */
function startConfetti() {
    for(let i=0;i<140;i++){
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random()*100+"vw";
        c.style.background =
            `hsl(${Math.random()*360},100%,70%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4500);
    }
}

/* LICZNIK */
const startDate = new Date("2025-02-02");
setInterval(() => {
    const days = Math.floor((new Date()-startDate)/(1000*60*60*24));
    document.getElementById("counter").innerText =
        `Jestem najszczęśliwszym chłopakiem na świecie od ${days} dni.`;
},1000);
</script>

</body>
</html>
